workflows:
  ios-testflight-workflow:
    name: iOS TestFlight Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      groups:
        - apple_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
    scripts:
      - name: Set up code signing settings
        script: |
          # 1. Initialize a clean temporary system keychain
          keychain initialize
          
          # 2. Re-create the hidden native Apple directory structure on the virtual Mac
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          # 3. Manually decode your Base64 dashboard text variables into physical system files
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          
          # 4. Import the physical certificate using strict explicit flags
          keychain add-certificates --certificate=/tmp/certificate.p12 --certificate-password="$CM_CERTIFICATE_PASSWORD"
      - name: Force Rewrite Frozen Xcode Build Metadata
        script: |
          # Wipes out any cached data and forces a hard text replacement inside native iOS files
          flutter clean
          find ios -type f \( -name "*.xcconfig" -o -name "*.sh" -o -name "*.pbxproj" -o -name "*.plist" \) -exec sed -i '' 's/FLUTTER_BUILD_NUMBER=24/FLUTTER_BUILD_NUMBER=390/g' {} +
          find ios -type f \( -name "*.xcconfig" -o -name "*.sh" -o -name "*.pbxproj" -o -name "*.plist" \) -exec sed -i '' 's/CURRENT_PROJECT_VERSION = 24/CURRENT_PROJECT_VERSION = 390/g' {} +
          find ios -type f \( -name "*.xcconfig" -o -name "*.sh" -o -name "*.pbxproj" -o -name "*.plist" \) -exec sed -i '' 's/>24</>390</g' {} +
      - name: Flutter build App Store IPA
        script: |
          flutter pub get
          
          # We pass custom xcargs flags to force Xcode to override local file presets and sign with your App Store assets
          flutter build ipa --release \
            --export-method=app-store \
            --build-number=390 \
            --xcargs="DEVELOPMENT_TEAM=KAP78JLY35,CODE_SIGN_STYLE=Manual,CODE_SIGN_IDENTITY='Apple Distribution'"
    artifacts:
      - build/ios/ipa/*.ipa
