workflows:
  ios-testflight-workflow:
    name: iOS TestFlight Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      groups:
        - apple_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
    scripts:
      - name: Set up code signing settings
        script: |
          keychain initialize
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          keychain add-certificates --certificate=/tmp/certificate.p12 --certificate-password="$CM_CERTIFICATE_PASSWORD"
      - name: Force Rewrite Frozen Xcode Build Metadata
        script: |
          flutter clean
          find ios -type f \( -name "*.xcconfig" -o -name "*.sh" -o -name "*.pbxproj" -o -name "*.plist" \) -exec sed -i '' 's/FLUTTER_BUILD_NUMBER=24/FLUTTER_BUILD_NUMBER=520/g' {} +
          find ios -type f \( -name "*.xcconfig" -o -name "*.sh" -o -name "*.pbxproj" -o -name "*.plist" \) -exec sed -i '' 's/CURRENT_PROJECT_VERSION = 24/CURRENT_PROJECT_VERSION = 520/g' {} +
          find ios -type f \( -name "*.xcconfig" -o -name "*.sh" -o -name "*.pbxproj" -o -name "*.plist" \) -exec sed -i '' 's/>24</>520</g' {} +
          
          sed -i '' 's/buildSettings = {/buildSettings = {\n\t\t\t\tDEVELOPMENT_TEAM = KAP78JLY35;\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = ESP32_Reader_Provisioning_Profile;/g' ios/Runner.xcodeproj/project.pbxproj
          
          mkdir -p ios/Flutter
          echo "DEVELOPMENT_TEAM = KAP78JLY35" >> ios/Flutter/Generated.xcconfig
          echo "CODE_SIGN_STYLE = Manual" >> ios/Flutter/Generated.xcconfig
          echo "CODE_SIGN_IDENTITY = Apple Distribution" >> ios/Flutter/Generated.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER = ESP32_Reader_Provisioning_Profile" >> ios/Flutter/Generated.xcconfig
      - name: Flutter build App Store IPA
        script: |
          flutter pub get
          flutter build ipa --release --export-method=app-store --build-number=520
      - name: Deploy Compiled Binary to Apple TestFlight
        script: |
          # Added the explicit path target pointing directly to your compiled Flutter application package file container
          app-store-connect publish \
            --issuer-id="$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id="$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key="$APP_STORE_CONNECT_PRIVATE_KEY" \
            --path="build/ios/ipa/esp32_ios_reader.ipa"
    artifacts:
      - build/ios/ipa/*.ipa
