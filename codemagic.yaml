workflows:
  ios-testflight-workflow:
    name: iOS TestFlight Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
    scripts:
      - name: Set up code signing settings
        script: |
          keychain initialize
          
          # This writes your private key precisely to a temporary file right on the Mac runner
          cat << 'EOF' > /tmp/apple_key.p8
          -----BEGIN PRIVATE KEY-----
          PASTE_YOUR_NOTEPAD_TEXT_HERE_LINE_BY_LINE_EXACTLY_AS_IT_LOOKS
          -----END PRIVATE KEY-----
          EOF
          
          # Run the connection fetch using the clean file reference path
          app-store-connect fetch-signing-files "com.rtvoorhees.esp32_ios_reader" \
            --issuer-id "PASTE_YOUR_LONG_ISSUER_ID_STRING_HERE" \
            --key-id "PASTE_YOUR_10_DIGIT_KEY_ID_HERE" \
            --private-key /tmp/apple_key.p8 \
            --type IOS_APP_STORE \
            --create
            
          keychain add-certificates
      - name: Force Rewrite Frozen Xcode Build Metadata
        script: |
          # Wipes out any cached data and forces a hard text replacement inside native iOS files
          flutter clean
          find ios -type f \( -name "*.xcconfig" -o -name "*.sh" -o -name "*.pbxproj" -o -name "*.plist" \) -exec sed -i '' 's/FLUTTER_BUILD_NUMBER=24/FLUTTER_BUILD_NUMBER=145/g' {} +
          find ios -type f \( -name "*.xcconfig" -o -name "*.sh" -o -name "*.pbxproj" -o -name "*.plist" \) -exec sed -i '' 's/CURRENT_PROJECT_VERSION = 24/CURRENT_PROJECT_VERSION = 145/g' {} +
          find ios -type f \( -name "*.xcconfig" -o -name "*.sh" -o -name "*.pbxproj" -o -name "*.plist" \) -exec sed -i '' 's/>24</>145</g' {} +
      - name: Flutter build App Store IPA
        script: |
          flutter pub get
          flutter build ipa --release --build-number=145
    artifacts:
      - build/ios/ipa/*.ipa
